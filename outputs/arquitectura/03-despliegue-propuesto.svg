    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #50677a" transform="translate(723.6 274.578867)">La API devuelve un ID; la interfaz consulta</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; fill: #50677a" transform="translate(723.6 290.897344)">el progreso hasta que el trabajo termina.</text>
   </g>
   <g id="text_27">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #172e44" x="50.4" y="396" transform="rotate(-0 50.4 396)">Una VM al inicio</text>
   </g>
   <g id="text_28">
    <text style="font-size: 10.8px; font-family: 'DejaVu Sans'; fill: #50677a" transform="translate(50.4 442.990125)">Servicios en Docker Compose.</text>
    <text style="font-size: 10.8px; font-family: 'DejaVu Sans'; fill: #50677a" transform="translate(50.4 461.890125)">La cola permite limitar concurrencia</text>
    <text style="font-size: 10.8px; font-family: 'DejaVu Sans'; fill: #50677a" transform="translate(50.4 481.006125)">y mover el worker a otra máquina</text>
    <text style="font-size: 10.8px; font-family: 'DejaVu Sans'; fill: #50677a" transform="translate(50.4 499.690125)">cuando aumente la carga.</text>
   </g>
   <g id="text_29">
    <text style="font-size: 10.2px; font-family: 'DejaVu Sans'; fill: #50677a" transform="translate(50.4 540.378563)">La base guarda geometrías;</text>
    <text style="font-size: 10.2px; font-family: 'DejaVu Sans'; fill: #50677a" transform="translate(50.4 556.698562)">el almacén guarda archivos grandes.</text>
    <text style="font-size: 10.2px; font-family: 'DejaVu Sans'; fill: #50677a" transform="translate(50.4 572.814562)">Si se usa GPU, se asigna al worker.</text>
   </g>
  </g>
 </g>
